name: 'ETH_2026_sample'
version: '1.0.0'
config-version: 2

profile: 'ETH_2026_sample'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"
  
models:
  ETH_2026_sample:
    +persist_docs:
      relation: true  # This pushes the table-level description
      columns: true   # This pushes the column-level descriptions

    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: table
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts
