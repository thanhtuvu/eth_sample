version: 2
semantic_models:
  - name: semantic_wallet_cluster
    description: "Wallet cluster risk and ETH activity"
    model: ref('fct_clusters_audit')

    defaults:
      agg_time_dimension: created_at

    entities:
      - name: cluster
        type: primary
        expr: cluster_id

    dimensions:
      - name: risk_flag
        type: categorical
        expr: risk_flag

      - name: size_status
        type: categorical
        expr: size_status

      - name: created_at
        type: time
        expr: created_at

        type_params:
          time_granularity: day

    measures:
      - name: clusters_count
        agg: count_distinct
        expr: cluster_id

      - name: total_eth
        agg: sum
        expr: total_eth_value

      - name: high_risk_clusters_count
        agg: sum
        expr: is_high_risk

metrics:
  - name: clusters_count
    label: "clusters Count"
    type: simple   
    type_params:
      measure:
        name: clusters_count

  - name: total_eth
    label: "total ETH value"
    type: simple  
    type_params:
      measure:
        name: total_eth

  - name: high_risk_clusters_count
    label: "clusters count of high risk category" 
    type: simple
    type_params:
      measure:
        name: high_risk_clusters_count

  - name: pct_high_risk
    label: "high risk category share"
    type: derived
    type_params:
      expr: high_risk_clusters_count / clusters_count

      metrics:
        - name: high_risk_clusters_count
        - name: clusters_count

  - name: avg_eth_by_risk_flag
    label: "average ETH value by risk flag"
    type: derived
    type_params:
      expr: total_eth / clusters_count

      metrics:
        - name: total_eth
        - name: clusters_count